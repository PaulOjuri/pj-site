<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A" />
    <title>Agent — offline</title>
    <style>
      /* Standalone, no network: this page ships its own styles rather than waiting for a stylesheet. */
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #0a0a0a;
        color: #f0ece2;
        font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        font-weight: 300;
        text-align: center;
      }
      h1 { font-size: 1.4rem; font-weight: 400; margin: 0 0 0.75rem; }
      p { color: #8a8578; font-size: 0.95rem; line-height: 1.6; margin: 0 0 1.5rem; max-width: 24rem; }
      a {
        color: #0a0a0a;
        background: #c9a84c;
        text-decoration: none;
        padding: 0.7rem 1.1rem;
        border-radius: 8px;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>No connection</h1>
      <p>
        Agent needs the network to read your inbox, reminders and chat. Everything you have already sent is safe on
        the server.
      </p>
      <a href="/app">Try again</a>
    </main>
  </body>
</html>
